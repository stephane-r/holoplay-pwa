name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one that's in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # REACT_APP_API_URL/REACT_APP_PLAUSIBLE_ANALYTICS live in the
    # "Production" environment's variables (name is case-sensitive) — only
    # a job that declares this environment can read them via the `vars`
    # context below.
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Pages serves this repo at /holoplay-pwa/, not the domain root —
          # see vite.config.mts for why this has to change the asset base.
          VITE_BASE_PATH: /holoplay-pwa/
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_PLAUSIBLE_ANALYTICS: ${{ vars.REACT_APP_PLAUSIBLE_ANALYTICS }}

      # GitHub Pages has no server-side rewrites (unlike nginx's try_files
      # for the Docker deployment), so a direct link or refresh on a
      # client-side route (e.g. /search) 404s. Serving index.html as the
      # 404 response is the standard workaround: the browser's address bar
      # keeps the originally requested path, and React Router picks it up
      # from there once the app loads.
      - name: SPA fallback for client-side routes
        run: cp build/index.html build/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Reuses the same "Production" environment the old Vercel integration
    # deployed to, so a successful Pages deployment here is what shows up
    # as the latest "Production" status on the repo page — instead of a
    # separate "github-pages" entry sitting next to Vercel's last (now
    # permanently stale) deployment.
    environment:
      name: Production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
